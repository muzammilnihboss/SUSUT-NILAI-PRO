<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai.My - Depreciation Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] },
                        colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-header { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-[#f8fafc]">

    <header class="glass-header text-slate-100 p-4 sticky top-0 z-30 border-b border-slate-800 flex items-center justify-between shadow-premium no-print">
        <a href="dashboard.html" class="flex items-center space-x-3.5">
            <div class="bg-gradient-to-br from-brand-500 to-emerald-600 text-white p-2.5 rounded-2xl shadow-lg"><i class="fa-solid fa-vault text-lg"></i></div>
            <div>
                <span class="text-base font-extrabold tracking-tight text-white block">Susut<span class="text-brand-500">Nilai.My</span></span>
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider block">Smart SMB Asset Hub</span>
            </div>
        </a>
        <nav class="hidden md:flex items-center space-x-1 bg-slate-950 p-1.5 rounded-2xl border border-slate-800/80">
            <a href="dashboard.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white">Dashboard</a>
            <a href="servicereport.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white">Service Report</a>
            <a href="invoicemanager.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white">Invoice Manager</a>
            <a href="registernew.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white">Register New</a>
            <a href="assetregister.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white">Asset Register</a>
            <a href="depreciationschedule.html" class="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white">Depreciation Schedule</a>
        </nav>
        <div class="flex items-center space-x-3">
            <div class="hidden sm:flex items-center space-x-2 bg-slate-900/80 px-3.5 py-2 rounded-xl border border-slate-800/80">
                <i class="fa-solid fa-user-shield text-emerald-400 text-xs"></i>
                <span id="user-display-id" class="text-[10px] font-bold text-white block max-w-[80px] truncate">Guest</span>
            </div>
            <button onclick="lockSystem()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 p-2.5 rounded-xl border border-red-500/20"><i class="fa-solid fa-power-off text-base"></i></button>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-8 pb-24 md:pb-8">
        <div id="print-susut-area" class="bg-white p-6 sm:p-10 rounded-3xl border border-slate-200/60 shadow-premium space-y-8">
            <div class="flex flex-col sm:flex-row items-center justify-between border-b-2 border-slate-900 pb-5 gap-5">
                <div>
                    <h4 class="text-xs uppercase font-extrabold text-slate-400">General Ledger Financial Statement</h4>
                    <h3 class="text-xl sm:text-2xl font-black text-slate-900 uppercase">DEPRECIATION SCHEDULE FOR:</h3>
                    <h4 id="dep-schedule-firm" class="text-xs font-semibold text-slate-700 mt-1 uppercase">FOR BUSINESS: GUEST_VAULT</h4>
                </div>
                <div class="flex items-center space-x-2 bg-slate-100 p-2 rounded-2xl border no-print">
                    <label class="text-xs font-bold text-slate-700 px-2">Select Year:</label>
                    <select id="schedule-year-select" onchange="renderFormalDepreciationSchedule()" class="bg-white border rounded-xl px-4 py-2 text-xs font-bold text-indigo-700">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                    </select>
                    <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-xl text-xs"><i class="fa-solid fa-print mr-1"></i>Print</button>
                </div>
            </div>

            <div id="formal-depreciation-schedule-container" class="space-y-6"></div>
        </div>
    </main>

    <script>
        let activeVaultUser = localStorage.getItem('activeVaultUser') || 'guest_vault';

        window.onload = function() {
            if (!localStorage.getItem('activeVaultUser')) { window.location.href = 'index.html'; return; }
            document.getElementById('user-display-id').innerText = activeVaultUser;
            document.getElementById('dep-schedule-firm').innerText = `FOR BUSINESS: ${activeVaultUser.toUpperCase()}`;
            renderFormalDepreciationSchedule();
        };

        function lockSystem() { localStorage.removeItem('activeVaultUser'); window.location.href = 'index.html'; }

        function renderFormalDepreciationSchedule() {
            const container = document.getElementById('formal-depreciation-schedule-container');
            let assets = JSON.parse(localStorage.getItem(`assets_${activeVaultUser}`) || '[]');
            const selYear = parseInt(document.getElementById('schedule-year-select').value);

            if (assets.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 text-xs py-8">No active assets available for schedule generation.</p>`;
                return;
            }

            let html = `
                <div class="overflow-x-auto rounded-2xl border border-slate-200">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="bg-slate-100 border-b font-bold text-slate-700">
                                <th class="p-3">Asset Description</th>
                                <th class="p-3 text-right">Cost (RM)</th>
                                <th class="p-3 text-right">Prior Acc. Dep (RM)</th>
                                <th class="p-3 text-right">Current Year Dep (RM)</th>
                                <th class="p-3 text-right">Ending Book Value (RM)</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y font-medium">`;

            assets.forEach(a => {
                const cost = parseFloat(a.cost);
                const salvage = parseFloat(a.salvage || 0);
                const life = parseInt(a.life || 1);
                const pYear = new Date(a.purchaseDate).getFullYear();
                const annualDep = (cost - salvage) / life;

                let priorYears = Math.max(0, selYear - pYear);
                let priorAccDep = Math.min(cost - salvage, annualDep * priorYears);
                let currDep = (selYear >= pYear && priorAccDep < (cost - salvage)) ? annualDep : 0;
                let endingBook = Math.max(salvage, cost - (priorAccDep + currDep));

                html += `
                    <tr>
                        <td class="p-3 font-bold">${a.name}</td>
                        <td class="p-3 text-right font-mono">RM ${cost.toFixed(2)}</td>
                        <td class="p-3 text-right font-mono">RM ${priorAccDep.toFixed(2)}</td>
                        <td class="p-3 text-right font-mono text-rose-600">RM ${currDep.toFixed(2)}</td>
                        <td class="p-3 text-right font-mono font-bold text-emerald-600">RM ${endingBook.toFixed(2)}</td>
                    </tr>`;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>

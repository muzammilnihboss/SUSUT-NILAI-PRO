<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai.My - Depreciation Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-[#f8fafc]">

    <header class="bg-slate-900 text-slate-100 p-4 sticky top-0 z-30 border-b border-slate-800 flex items-center justify-between">
        <a href="dashboard.html" class="flex items-center space-x-3 text-white font-extrabold">
            <div class="bg-emerald-500 p-2 rounded-xl"><i class="fa-solid fa-vault"></i></div>
            <span>Susut<span class="text-emerald-500">Nilai.My</span></span>
        </a>
        <nav class="hidden md:flex space-x-2 text-xs font-semibold">
            <a href="dashboard.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Dashboard</a>
            <a href="servicereport.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Service Report</a>
            <a href="invoicemanager.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Invoice Manager</a>
            <a href="registernew.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Register New</a>
            <a href="assetregister.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Asset Register</a>
            <a href="depreciationschedule.html" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg">Depreciation Schedule</a>
        </nav>
    </header>

    <main class="flex-grow p-6 max-w-7xl mx-auto w-full space-y-6">
        <div class="bg-white p-6 sm:p-10 rounded-3xl border border-slate-200/60 shadow-lg space-y-6">
            <div class="flex items-center justify-between border-b-2 border-slate-900 pb-5">
                <div>
                    <h4 class="text-xs uppercase tracking-widest font-extrabold text-slate-400">General Ledger Financial Statement</h4>
                    <h3 class="text-xl sm:text-2xl font-black text-slate-900 uppercase">DEPRECIATION SCHEDULE FOR: 2026</h3>
                </div>
                <button onclick="window.print()" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-xl text-xs flex items-center space-x-2">
                    <i class="fa-solid fa-print"></i><span>Print Schedule</span>
                </button>
            </div>

            <div class="overflow-x-auto rounded-2xl border border-slate-200">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 font-bold">
                            <th class="p-3">Year</th>
                            <th class="p-3">Beginning Value (RM)</th>
                            <th class="p-3">Depreciation Charge (RM)</th>
                            <th class="p-3">Ending Book Value (RM)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 font-medium">
                        <tr>
                            <td class="p-3">2026</td>
                            <td class="p-3">RM 3,500.00</td>
                            <td class="p-3 text-rose-600">RM 700.00</td>
                            <td class="p-3 font-bold">RM 2,800.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>

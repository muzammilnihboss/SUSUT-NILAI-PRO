<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New Asset - Susut Nilai Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-links {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .back-btn {
      text-decoration: none;
      color: #64748b;
      font-weight: 600;
      font-size: 14px;
    }

    .back-btn:hover { color: #0f172a; }

    .form-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .form-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 30px;
    }

    .header-icon {
      background-color: #dcfce7;
      color: #16a34a;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .form-header h2 { font-size: 20px; color: #0f172a; font-weight: 700; }
    .form-header p { font-size: 13px; color: #64748b; margin-top: 4px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .col-12 { grid-column: span 12; }
    .col-6  { grid-column: span 6; }
    .col-5  { grid-column: span 5; }
    .col-4  { grid-column: span 4; }
    .col-3  { grid-column: span 3; }
    .col-2  { grid-column: span 2; }

    @media (max-width: 768px) {
      .col-6, .col-5, .col-4, .col-3, .col-2 { grid-column: span 12; }
    }

    .form-group { display: flex; flex-direction: column; }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-group label span { color: #ef4444; }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      color: #1e293b;
      background-color: #fff;
    }

    .form-control:focus {
      border-color: #10b981;
      outline: none;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .form-control[readonly] { background-color: #f8fafc; color: #64748b; font-weight: 700; }

    .sub-section {
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 14px;
      padding: 20px;
      margin-top: 10px;
    }

    .sub-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .submit-btn {
      width: 100%;
      background-color: #059669;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 25px;
    }

    .submit-btn:hover { background-color: #047857; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
      <div class="nav-links">
        <a href="assetregister.html" class="back-btn">View Asset Register</a>
        <a href="index.html" class="back-btn">Log Out</a>
      </div>
    </div>

    <div class="form-card">
      <div class="form-header">
        <div class="header-icon">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <div>
          <h2>Manual Asset Registration Protocol</h2>
          <p>Configure parameters accurately to execute general ledger amortization plans.</p>
        </div>
      </div>

      <form onsubmit="saveNewAsset(event)">
        <div class="form-grid">
          
          <div class="form-group col-12">
            <label>Asset Name / Description <span>*</span></label>
            <input type="text" id="inpItem" class="form-control" placeholder="e.g. Ergonomic Office Chair" required>
          </div>

          <div class="form-group col-6">
            <label>Supplier Name <span>*</span></label>
            <input type="text" id="inpSupplier" class="form-control" placeholder="e.g. Apex Furniture Sdn Bhd" required>
          </div>

          <div class="form-group col-6">
            <label>Invoice Number <span>*</span></label>
            <input type="text" id="inpRefNo" class="form-control" placeholder="e.g. INV/2026/0912" required>
          </div>

          <div class="form-group col-6">
            <label>Asset Classification Category</label>
            <select id="assetCategory" class="form-control" onchange="toggleOtherCategory()">
              <option value="Office Equipment">Office Equipment</option>
              <option value="Computer & Hardware">Computer & Hardware</option>
              <option value="Furniture & Fittings">Furniture & Fittings</option>
              <option value="Motor Vehicle">Motor Vehicle</option>
              <option value="Electrical Installation">Electrical Installation</option>
              <option value="System & Development">System & Development</option>
              <option value="Renovation">Renovation</option>
              <option value="Shop Lot">Shop Lot</option>
              <option value="Other Asset">Other Asset</option>
            </select>
          </div>

          <div class="form-group col-6">
            <label>Purchase Date</label>
            <input type="date" id="inpPurchaseDate" class="form-control" required>
          </div>

          <div id="otherCategoryGroup" class="form-group col-12 hidden">
            <label>Specify Other Asset Category <span>*</span></label>
            <input type="text" id="otherCategoryInput" class="form-control" placeholder="Enter custom category name">
          </div>

          <div class="form-group col-5">
            <label>Deployment Department / Location <span>*</span></label>
            <input type="text" id="inpLocation" class="form-control" placeholder="e.g. Administrative Office HQ" required>
          </div>

          <div class="form-group col-2">
            <label>Unit</label>
            <input type="number" id="unitInput" class="form-control" value="1" min="1" oninput="calculateTotal()" required>
          </div>

          <div class="form-group col-2">
            <label>Unit Price (RM)</label>
            <input type="number" id="unitPriceInput" class="form-control" placeholder="0.00" step="0.01" oninput="calculateTotal()" required>
          </div>

          <div class="form-group col-3">
            <label>Total (RM)</label>
            <input type="text" id="totalInput" class="form-control" value="0.00" readonly>
          </div>

          <div class="form-group col-4">
            <label>Estimated Salvage (RM)</label>
            <input type="number" class="form-control" placeholder="0.00" step="0.01">
          </div>

          <div class="form-group col-4">
            <label>Estimated Useful Life (Yrs)</label>
            <input type="number" id="inpLifespan" class="form-control" value="5" required>
          </div>

          <div class="form-group col-4">
            <label>Amortization Method</label>
            <select class="form-control">
              <option>Straight Line (Equal Amortization)</option>
            </select>
          </div>

          <div class="col-12 sub-section">
            <div class="sub-title">🔧 Preventive Servicing Intervals</div>
            <div class="form-grid">
              <div class="form-group col-6">
                <label>Last Service Date</label>
                <input type="date" class="form-control">
              </div>
              <div class="form-group col-6">
                <label>Service Interval (Months)</label>
                <input type="number" class="form-control" value="6">
              </div>
            </div>
          </div>

        </div>

        <button type="submit" class="submit-btn">💾 Save Asset to Ledger Book</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('inpPurchaseDate').valueAsDate = new Date();

    function calculateTotal() {
      const unit = parseFloat(document.getElementById('unitInput').value) || 0;
      const price = parseFloat(document.getElementById('unitPriceInput').value) || 0;
      const total = unit * price;
      document.getElementById('totalInput').value = total.toFixed(2);
    }

    function toggleOtherCategory() {
      const categorySelect = document.getElementById('assetCategory');
      const otherGroup = document.getElementById('otherCategoryGroup');
      const otherInput = document.getElementById('otherCategoryInput');

      if (categorySelect.value === 'Other Asset') {
        otherGroup.classList.remove('hidden');
        otherInput.required = true;
      } else {
        otherGroup.classList.add('hidden');
        otherInput.required = false;
        otherInput.value = '';
      }
    }

    function saveNewAsset(event) {
      event.preventDefault();

      const catSelect = document.getElementById('assetCategory').value;
      const customCat = document.getElementById('otherCategoryInput').value;
      const finalCat = (catSelect === 'Other Asset' && customCat) ? customCat : catSelect;

      const newAsset = {
        id: Date.now().toString(),
        item: document.getElementById('inpItem').value,
        supplier: document.getElementById('inpSupplier').value,
        refNo: document.getElementById('inpRefNo').value,
        category: finalCat,
        purchaseDate: document.getElementById('inpPurchaseDate').value,
        location: document.getElementById('inpLocation').value,
        unit: parseInt(document.getElementById('unitInput').value) || 1,
        unitPrice: parseFloat(document.getElementById('unitPriceInput').value) || 0,
        total: parseFloat(document.getElementById('totalInput').value) || 0,
        lifespan: parseInt(document.getElementById('inpLifespan').value) || 5,
        disposalDate: '-',
        model: '-',
        updatedDate: new Date().toISOString().split('T')[0],
        updatedBy: 'Admin'
      };

      const existingAssets = JSON.parse(localStorage.getItem('susut_nilai_assets')) || [];
      existingAssets.push(newAsset);
      localStorage.setItem('susut_nilai_assets', JSON.stringify(existingAssets));

      alert('Asset successfully registered!');
      window.location.href = 'assetregister.html';
    }
  </script>

</body>
</html>

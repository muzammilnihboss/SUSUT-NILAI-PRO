<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai.My - Register New Asset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-[#f8fafc] font-sans">
    <header class="bg-slate-900 text-slate-100 p-4 sticky top-0 z-30 border-b border-slate-800 flex items-center justify-between shadow-lg">
        <a href="dashboard.html" class="flex items-center space-x-3.5">
            <div class="bg-gradient-to-br from-emerald-500 to-brand-600 text-white p-2.5 rounded-2xl shadow-lg">
                <i class="fa-solid fa-vault text-lg"></i>
            </div>
            <div>
                <span class="text-base font-extrabold tracking-tight text-white block">Susut<span class="text-brand-500">Nilai.My</span></span>
                <span class="text-[9px] text-slate-400 font-semibold uppercase tracking-wider block">Smart SMB Asset Hub</span>
            </div>
        </a>
        
        <nav class="hidden md:flex items-center space-x-1 bg-slate-950 p-1.5 rounded-2xl border border-slate-800/80">
            <a href="dashboard.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-900/80">Dashboard</a>
            <a href="servicereport.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-900/80">Service Report</a>
            <a href="invoicemanager.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-900/80">Invoice Manager</a>
            <a href="registernew.html" class="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white shadow-sm">Register New</a>
            <a href="assetregister.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-900/80">Asset Register</a>
            <a href="depreciationschedule.html" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-900/80">Depreciation Schedule</a>
        </nav>

        <div class="flex items-center space-x-3">
            <a href="index.html" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 p-2.5 rounded-xl border border-red-500/20 transition-all duration-200" title="Lock Session">
                <i class="fa-solid fa-power-off text-base"></i>
            </a>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/60 shadow-lg space-y-5">
                <div class="flex items-center space-x-3.5 border-b border-slate-100 pb-4">
                    <div class="bg-brand-50 text-brand-600 w-11 h-11 rounded-2xl flex items-center justify-center border border-brand-100/50 shadow-sm">
                        <i class="fa-solid fa-file-pen text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-extrabold text-slate-900 tracking-tight">Manual Asset Registration Protocol</h3>
                        <p class="text-xs text-slate-400">Configure parameters accurately to execute general ledger amortization plans.</p>
                    </div>
                </div>

                <form class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Asset Name / Description <span class="text-red-500">*</span></label>
                        <input type="text" required placeholder="e.g. Ergonomic Office Chair" class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-4 py-3 text-xs">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Supplier Name</label>
                            <input type="text" placeholder="Apex Furniture" class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-4 py-3 text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Invoice Number</label>
                            <input type="text" placeholder="INV/2026/0912" class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-4 py-3 text-xs">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-emerald-600 text-white font-bold py-4 rounded-xl text-xs transition duration-200 flex items-center justify-center space-x-2 shadow-md">
                        <i class="fa-solid fa-floppy-disk"></i><span>Save Asset to Ledger Book</span>
                    </button>
                </form>
            </div>
        </div>
    </main>
    <footer class="bg-white border-t border-slate-200 p-5 text-center text-xs text-slate-400 mt-auto">
        &copy; 2026 SusutNilai.My.
    </footer>
</body>
</html>

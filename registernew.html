<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New Asset - Susut Nilai Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      text-decoration: none;
      color: #64748b;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      color: #0f172a;
    }

    .form-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    /* Header Form */
    .form-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 30px;
    }

    .header-icon {
      background-color: #dcfce7;
      color: #16a34a;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .form-header h2 {
      font-size: 20px;
      color: #0f172a;
      font-weight: 700;
    }

    .form-header p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    /* Layout Grid */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .col-12 { grid-column: span 12; }
    .col-6  { grid-column: span 6; }
    .col-5  { grid-column: span 5; }
    .col-4  { grid-column: span 4; }
    .col-3  { grid-column: span 3; }
    .col-2  { grid-column: span 2; }

    @media (max-width: 768px) {
      .col-6, .col-5, .col-4, .col-3, .col-2 {
        grid-column: span 12;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-group label span {
      color: #ef4444;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      color: #1e293b;
      background-color: #fff;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: #10b981;
      outline: none;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .form-control[readonly] {
      background-color: #f8fafc;
      color: #64748b;
      font-weight: 700;
    }

    /* Section Sub Box (Preventive Servicing) */
    .sub-section {
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 14px;
      padding: 20px;
      margin-top: 10px;
    }

    .sub-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .sub-title span {
      color: #ef4444;
    }

    .submit-btn {
      width: 100%;
      background-color: #059669;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 25px;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #047857;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
      <a href="index.html" class="back-btn">Log Out</a>
    </div>

    <div class="form-card">
      <div class="form-header">
        <div class="header-icon">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <div>
          <h2>Manual Asset Registration Protocol</h2>
          <p>Configure parameters accurately to execute general ledger amortization plans.</p>
        </div>
      </div>

      <form onsubmit="handleFormSubmit(event)">
        <div class="form-grid">
          
          <!-- Asset Name -->
          <div class="form-group col-12">
            <label>Asset Name / Description <span>*</span></label>
            <input type="text" class="form-control" placeholder="e.g. Ergonomic Office Chair" required>
          </div>

          <!-- Supplier Name -->
          <div class="form-group col-6">
            <label>Supplier Name <span>*</span></label>
            <input type="text" class="form-control" placeholder="e.g. Apex Furniture Sdn Bhd" required>
          </div>

          <!-- Invoice Number -->
          <div class="form-group col-6">
            <label>Invoice Number <span>*</span></label>
            <input type="text" class="form-control" placeholder="e.g. INV/2026/0912" required>
          </div>

          <!-- Asset Classification Category -->
          <div class="form-group col-6">
            <label>Asset Classification Category</label>
            <select id="assetCategory" class="form-control" onchange="toggleOtherCategory()">
              <option value="Office Equipment">Office Equipment</option>
              <option value="Computer & Hardware">Computer & Hardware</option>
              <option value="Furniture & Fittings">Furniture & Fittings</option>
              <option value="Motor Vehicle">Motor Vehicle</option>
              <option value="System & Development">System & Development</option>
              <option value="Renovation">Renovation</option>
              <option value="Shop Lot">Shop Lot</option>
              <option value="Other Asset">Other Asset</option>
            </select>
          </div>

          <!-- Purchase Date -->
          <div class="form-group col-6">
            <label>Purchase Date</label>
            <input type="date" class="form-control" value="2026-01-08">
          </div>

          <!-- Custom Category Input (Hanya terpapar jika "Other Asset" dipilih) -->
          <div id="otherCategoryGroup" class="form-group col-12 hidden">
            <label>Specify Other Asset Category <span>*</span></label>
            <input type="text" id="otherCategoryInput" class="form-control" placeholder="Enter custom asset category name">
          </div>

          <!-- Deployment Department -->
          <div class="form-group col-5">
            <label>Deployment Department <span>*</span></label>
            <input type="text" class="form-control" placeholder="e.g. Administrative Office HQ" required>
          </div>

          <!-- Unit -->
          <div class="form-group col-2">
            <label>Unit</label>
            <input type="number" id="unitInput" class="form-control" value="1" min="1" oninput="calculateTotal()">
          </div>

          <!-- Unit Price -->
          <div class="form-group col-2">
            <label>Unit Price</label>
            <input type="number" id="unitPriceInput" class="form-control" placeholder="0.00" step="0.01" oninput="calculateTotal()">
          </div>

          <!-- Total (Auto-calculated) -->
          <div class="form-group col-3">
            <label>Total</label>
            <input type="text" id="totalInput" class="form-control" value="0.00" readonly>
          </div>

          <!-- Estimated Salvage -->
          <div class="form-group col-4">
            <label>Estimated Salvage (RM)</label>
            <input type="number" class="form-control" placeholder="0.00" step="0.01">
          </div>

          <!-- Estimated Useful Life -->
          <div class="form-group col-4">
            <label>Estimated Useful Life (Yrs)</label>
            <input type="number" class="form-control" value="5">
          </div>

          <!-- Amortization Method -->
          <div class="form-group col-4">
            <label>Amortization Method</label>
            <select class="form-control">
              <option>Straight Line (Equal Amortization)</option>
            </select>
          </div>

          <!-- Preventive Servicing Intervals Box -->
          <div class="col-12 sub-section">
            <div class="sub-title">
              <span>🔧</span> Preventive Servicing Intervals
            </div>
            <div class="form-grid">
              <div class="form-group col-6">
                <label>Last Service Date</label>
                <input type="date" class="form-control" value="2026-01-08">
              </div>
              <div class="form-group col-6">
                <label>Service Interval (Months)</label>
                <input type="number" class="form-control" value="6">
              </div>
            </div>
          </div>

        </div>

        <button type="submit" class="submit-btn">
          💾 Save Asset to Ledger Book
        </button>
      </form>
    </div>
  </div>

  <script>
    // Fungsi Pengiraan Automatik Total (Unit * Unit Price)
    function calculateTotal() {
      const unit = parseFloat(document.getElementById('unitInput').value) || 0;
      const price = parseFloat(document.getElementById('unitPriceInput').value) || 0;
      const total = unit * price;
      document.getElementById('totalInput').value = total.toFixed(2);
    }

    // Fungsi Papar/Sembunyi Medan 'Other Asset'
    function toggleOtherCategory() {
      const categorySelect = document.getElementById('assetCategory');
      const otherGroup = document.getElementById('otherCategoryGroup');
      const otherInput = document.getElementById('otherCategoryInput');

      if (categorySelect.value === 'Other Asset') {
        otherGroup.classList.remove('hidden');
        otherInput.required = true;
      } else {
        otherGroup.classList.add('hidden');
        otherInput.required = false;
        otherInput.value = '';
      }
    }

    // Simpan Borang & Kembali ke Dashboard
    function handleFormSubmit(event) {
  event.preventDefault();

  const categorySelect = document.getElementById('assetCategory').value;
  const customCategory = document.getElementById('otherCategoryInput').value;
  const finalCategory = (categorySelect === 'Other Asset' && customCategory) ? customCategory : categorySelect;

  const newAsset = {
    id: Date.now().toString(),
    item: event.target[0].value,
    supplier: event.target[1].value,
    refNo: event.target[2].value,
    category: finalCategory,
    purchaseDate: event.target[4].value,
    location: event.target[6].value,
    unit: parseInt(document.getElementById('unitInput').value) || 1,
    unitPrice: parseFloat(document.getElementById('unitPriceInput').value) || 0,
    total: parseFloat(document.getElementById('totalInput').value) || 0,
    lifespan: event.target[10].value || 5,
    updatedDate: new Date().toISOString().split('T')[0],
    updatedBy: 'Admin'
  };

  let assets = JSON.parse(localStorage.getItem('susut_nilai_assets')) || [];
  assets.push(newAsset);
  localStorage.setItem('susut_nilai_assets', JSON.stringify(assets));

  alert('Asset registered successfully!');
  window.location.href = 'assetregister.html'; // Pindah ke Asset Register
}
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai Pro - Register New Asset</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-3xl mx-auto p-8 space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">Pendaftaran Aset Baharu (Manual)</h1>
            <a href="dashboard.html" class="text-sm font-semibold text-blue-600 hover:underline">← Kembali ke Dashboard</a>
        </div>

        <form action="assetregister.html" method="GET" class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Nama Aset / Perkara</label>
                <input type="text" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="cth: Meja Pejabat Kayu Jati">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Kategori Aset</label>
                    <select class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                        <option>Perabot</option>
                        <option>Peralatan Pejabat</option>
                        <option>Pemasangan Elektrik</option>
                        <option>Komputer</option>
                        <option>Kenderaan</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Tarikh Pembelian</label>
                    <input type="date" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Kos Pembelian (RM)</label>
                    <input type="number" step="0.01" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Jangka Hayat (Tahun)</label>
                    <input type="number" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="5">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Nilai Sisa / Salvage (RM)</label>
                    <input type="number" step="0.01" value="0.00" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Nombor Siri / Tag Aset / No. Rujukan</label>
                <input type="text" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" placeholder="cth: AST-2026-001">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">Daftar Aset Baharu</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai.My - Register Asset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-[#f8fafc]">

    <header class="bg-slate-900 text-slate-100 p-4 sticky top-0 z-30 border-b border-slate-800 flex items-center justify-between">
        <a href="dashboard.html" class="flex items-center space-x-3 text-white font-extrabold">
            <div class="bg-emerald-500 p-2 rounded-xl"><i class="fa-solid fa-vault"></i></div>
            <span>Susut<span class="text-emerald-500">Nilai.My</span></span>
        </a>
        <nav class="hidden md:flex space-x-2 text-xs font-semibold">
            <a href="dashboard.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Dashboard</a>
            <a href="servicereport.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Service Report</a>
            <a href="invoicemanager.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Invoice Manager</a>
            <a href="registernew.html" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg">Register New</a>
            <a href="assetregister.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Asset Register</a>
            <a href="depreciationschedule.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Depreciation Schedule</a>
        </nav>
    </header>

    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/60 shadow-lg space-y-5">
                <div class="flex items-center space-x-3.5 border-b border-slate-100 pb-4">
                    <div class="bg-emerald-50 text-emerald-600 w-11 h-11 rounded-2xl flex items-center justify-center border border-emerald-100"><i class="fa-solid fa-file-pen text-lg"></i></div>
                    <div>
                        <h3 class="text-base font-extrabold text-slate-900">Manual Asset Registration Protocol</h3>
                        <p class="text-xs text-slate-400">Configure parameters accurately to execute amortization plans.</p>
                    </div>
                </div>

                <form id="manual-asset-form" class="space-y-4" onsubmit="event.preventDefault(); submitManualForm();">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Asset Name / Description *</label>
                        <input type="text" id="manual-name" required placeholder="e.g. Ergonomic Office Chair" class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-4 py-3 text-xs focus:outline-none focus:bg-white focus:border-emerald-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Supplier Name *</label>
                            <input type="text" id="manual-pembekal" required placeholder="e.g. Apex Furniture Sdn Bhd" class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-4 py-3 text-xs focus:outline-none focus:bg-white focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Invoice Number *</label>
                            <input type="text" id="manual-invois" required placeholder="e.g. INV/2026/0912" class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-4 py-3 text-xs focus:outline-none focus:bg-white focus:border-emerald-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Asset Classification Category</label>
                            <select id="manual-category" class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-4 py-3 text-xs focus:outline-none focus:bg-white focus:border-emerald-500 font-semibold">
                                <option value="Office Equipment">Office Equipment</option>
                                <option value="Computer & Hardware">Computer & Hardware</option>
                                <option value="Furniture & Fittings">Furniture & Fittings</option>
                                <option value="Motor Vehicle">Motor Vehicle</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Purchase Date</label>
                            <input type="date" id="manual-purchase-date" required class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-4 py-3 text-xs focus:outline-none focus:bg-white focus:border-emerald-500 font-semibold">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold py-4 rounded-xl text-xs shadow-md">
                        <i class="fa-solid fa-floppy-disk mr-2"></i>Save Asset to Ledger Book
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        function submitManualForm() {
            alert("Aset baharu berjaya didaftarkan!");
        }
    </script>
</body>
</html>

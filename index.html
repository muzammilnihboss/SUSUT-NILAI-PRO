<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Susut Nilai Pro - Portal Access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-header h1 {
      color: #2c5364;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .brand-header p {
      color: #666;
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #333;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: #2c5364;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #2c5364;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #203a43;
    }

    .switch-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    .switch-link a {
      color: #2c5364;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-header">
      <h1>Susut Nilai Pro</h1>
      <p id="subheading">Please enter your details to sign in.</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label for="loginName">Name</label>
        <input type="text" id="loginName" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="submit-btn">Sign In</button>
      <div class="switch-link">
        Don't have an account? <a onclick="toggleForm('signUp')">Sign Up</a>
      </div>
    </form>

    <!-- Sign Up Form -->
    <form id="signUpForm" class="hidden" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label for="signUpName">Full Name</label>
        <input type="text" id="signUpName" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="signUpPassword">Password</label>
        <input type="password" id="signUpPassword" placeholder="Create a password" required>
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
      <div class="switch-link">
        Already have an account? <a onclick="toggleForm('login')">Sign In</a>
      </div>
    </form>
  </div>

  <script>
    function toggleForm(view) {
      const loginForm = document.getElementById('loginForm');
      const signUpForm = document.getElementById('signUpForm');
      const subheading = document.getElementById('subheading');

      if (view === 'signUp') {
        loginForm.classList.add('hidden');
        signUpForm.classList.remove('hidden');
        subheading.innerText = 'Create an account to get started.';
      } else {
        signUpForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        subheading.innerText = 'Please enter your details to sign in.';
      }
    }

    function handleAuth(event) {
      event.preventDefault(); // Menghalang borang daripada refresh
      window.location.href = 'dashboard.html'; // Pindah ke dashboard
    }
  </script>

</body>
</html>

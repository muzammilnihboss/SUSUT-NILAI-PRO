<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai.My - Login Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                        colors: { brand: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669', 700: '#047857' } }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#070a13] font-sans antialiased text-slate-800">
    <div class="fixed inset-0 z-50 bg-[#070a13] flex flex-col items-center justify-center p-4">
        <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1.5px,transparent_1px)] [background-size:24px_24px] opacity-35 pointer-events-none"></div>
        <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl relative z-10">
            <div class="text-center mb-8">
                <div class="inline-flex bg-gradient-to-br from-brand-500 to-emerald-600 text-white p-4 rounded-2xl shadow-xl shadow-brand-500/20 mb-4 items-center justify-center">
                    <i class="fa-solid fa-vault text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">SusutNilai.My <span class="text-brand-500">Secure Vault</span></h1>
                <p class="text-xs text-slate-400 mt-2">Enterprise-Grade Asset & Encryption Ledger</p>
            </div>

            <div class="flex bg-slate-950 p-1 rounded-2xl mb-6 border border-slate-800/60">
                <button onclick="switchTab('signin')" id="tab-signin" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-white bg-slate-900 shadow">Unlock Vault</button>
                <button onclick="switchTab('signup')" id="tab-signup" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400">Register New Vault</button>
            </div>

            <form id="vault-form" onsubmit="handleAuth(event)" class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Vault ID / Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500"><i class="fa-regular fa-user text-sm"></i></span>
                        <input type="text" id="vault-id" required placeholder="demo@susutnilai.my" class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-600 text-xs focus:outline-none focus:border-brand-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">PIN Rahsia (6-Digit)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500"><i class="fa-solid fa-key text-sm"></i></span>
                        <input type="password" id="vault-pin" maxlength="6" required placeholder="123456" class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-600 text-center tracking-widest text-sm focus:outline-none focus:border-brand-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-emerald-600 hover:from-brand-500 hover:to-emerald-500 text-white font-bold py-4 px-4 rounded-xl text-xs transition duration-200 flex items-center justify-center space-x-2 shadow-lg shadow-brand-500/15">
                    <i class="fa-solid fa-lock-open"></i><span id="btn-text">Buka Vault</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const isSignin = tab === 'signin';
            document.getElementById('tab-signin').className = isSignin ? "flex-1 py-2.5 text-xs font-bold rounded-lg text-white bg-slate-900 shadow" : "flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400";
            document.getElementById('tab-signup').className = !isSignin ? "flex-1 py-2.5 text-xs font-bold rounded-lg text-white bg-slate-900 shadow" : "flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400";
            document.getElementById('btn-text').innerText = isSignin ? 'Buka Vault' : 'Cipta Vault Baru';
        }

        function handleAuth(e) {
            e.preventDefault();
            const pin = document.getElementById('vault-pin').value;
            if(pin.length === 6) {
                localStorage.setItem('susutnilai_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                alert('Sila masukkan PIN 6-digit yang sah!');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SusutNilai.My - Lock Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-[#050b14] text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#0b1329] border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 relative overflow-hidden">
    <!-- Logo Icon -->
    <div class="flex justify-center">
      <div class="w-14 h-14 bg-[#00b074] rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
    </div>

    <!-- Title -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black tracking-tight"><span class="text-white">SusutNilai.My </span><span class="text-[#00b074]">Secure Vault</span></h1>
      <p class="text-xs text-slate-400 font-medium">Enterprise-Grade Asset & Encryption Ledger for SMBs</p>
    </div>

    <!-- Tabs -->
    <div class="bg-[#060c19] p-1 rounded-xl flex border border-slate-800">
      <button class="flex-1 py-2.5 bg-[#121c33] text-white text-xs font-bold rounded-lg shadow">Unlock Vault</button>
      <button class="flex-1 py-2.5 text-slate-400 hover:text-white text-xs font-semibold transition">Register New Vault</button>
    </div>

    <!-- Form -->
    <form class="space-y-4" onsubmit="event.preventDefault();">
      <div>
        <label class="text-[10px] font-extrabold text-slate-400 tracking-wider uppercase block mb-1.5">VAULT ID / EMAIL ADDRESS</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">👤</span>
          <input type="text" placeholder="Enter your Vault ID or Business Email" class="w-full bg-[#060d1e] border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-[#00b074]">
        </div>
      </div>

      <div>
        <label class="text-[10px] font-extrabold text-slate-400 tracking-wider uppercase block mb-1.5">SECRET PIN (6-DIGIT)</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">🔑</span>
          <input type="password" placeholder="******" class="w-full bg-[#060d1e] border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-[#00b074]">
        </div>
      </div>

      <button type="submit" class="w-full py-3.5 bg-[#00b074] hover:bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center gap-2">
        🔓 Unlock Secure Vault
      </button>
    </form>

    <!-- Footer -->
    <div class="pt-4 border-t border-slate-800/60 flex items-center justify-between text-[10px] text-slate-500 font-medium">
      <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> AES-256 Data Shield</span>
      <span>ISO 27001 Protected</span>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai Pro - Log Masuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">SusutNilai Pro</h1>
            <p class="text-sm text-slate-500 mt-1">Sistem Pengurusan Aset & Susut Nilai Kewangan</p>
        </div>
        <form action="dashboard.html" method="GET" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">ID Pengguna / Emel</label>
                <input type="text" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" value="admin@perusahaan.com">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Laluan</label>
                <input type="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none" value="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">Log Masuk Sistem</button>
        </form>
    </div>
</body>
</html>

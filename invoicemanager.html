<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai Pro - Invoice Manager (OCR)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-5xl mx-auto p-8 space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">Invoice Manager (OCR Imbasan Resit)</h1>
            <a href="dashboard.html" class="text-sm font-semibold text-blue-600 hover:underline">← Kembali ke Dashboard</a>
        </div>

        <div class="bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center">
            <p class="text-sm text-slate-600 mb-4">Muat naik invois atau resit pembelian (Format: PNG, JPG, PDF)</p>
            <input type="file" class="hidden" id="fileUpload">
            <label for="fileUpload" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg cursor-pointer text-sm font-medium inline-block">Muat Naik & Imbas Dokumen</label>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
            <h2 class="font-bold text-lg">Hasil Imbasan OCR (Pengesahan Data)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead class="bg-slate-100 text-slate-700">
                        <tr>
                            <th class="p-3 border">Nama Aset</th>
                            <th class="p-3 border">Pembekal</th>
                            <th class="p-3 border">No. Invois</th>
                            <th class="p-3 border">Tarikh Beli</th>
                            <th class="p-3 border">Kos (RM)</th>
                            <th class="p-3 border">No. Siri</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="p-3 border"><input type="text" value="Dell Latitude 5420" class="w-full bg-slate-50 border p-1 rounded"></td>
                            <td class="p-3 border"><input type="text" value="Dell Malaysia Sdn Bhd" class="w-full bg-slate-50 border p-1 rounded"></td>
                            <td class="p-3 border"><input type="text" value="INV-2026-009" class="w-full bg-slate-50 border p-1 rounded"></td>
                            <td class="p-3 border"><input type="date" value="2026-01-15" class="w-full bg-slate-50 border p-1 rounded"></td>
                            <td class="p-3 border"><input type="number" value="4500.00" class="w-full bg-slate-50 border p-1 rounded"></td>
                            <td class="p-3 border"><input type="text" value="SN-9812401" class="w-full bg-slate-50 border p-1 rounded"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="flex justify-end">
                <button onclick="alert('Maklumat disahkan & dimasukkan ke Asset Register!')" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium">Sahkan & Masuk Ke Daftar Aset</button>
            </div>
        </div>
    </div>
</body>
</html>

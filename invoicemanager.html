<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Manager - Susut Nilai Pro</title>
    <!-- Library OCR & PDF -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f8fafc; padding: 20px; color: #0f172a; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        
        .upload-area {
            border: 2px dashed #2563eb;
            background: #eff6ff;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .file-btn {
            margin-top: 10px;
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #file-input { display: none; }
        
        .preview-box { width: 100%; max-height: 300px; object-fit: contain; margin-top: 10px; display: none; border: 1px solid #ddd; }
        .status-msg { padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 10px; display: none; }
        .info { background: #e0f2fe; color: #0369a1; }
        .success { background: #dcfce7; color: #15803d; }
        .error { background: #fee2e2; color: #b91c1c; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-submit { width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- SEKSYEN MUAT NAIK DOKUMEN -->
    <div class="card">
        <h3>📷 OCR Scanner Invois</h3>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">Sila pilih fail invois untuk dimuat naik.</p>

        <div class="upload-area" id="drop-zone">
            📄 <strong>Pilih atau Tarik Fail Ke Sini</strong><br>
            <span style="font-size: 11px; color: #666;">Format: PNG, JPG, PDF</span><br><br>
            
            <button class="file-btn" onclick="document.getElementById('file-input').click()">📂 Pilih Fail Dokumen</button>
            <input type="file" id="file-input" accept="image/*,.pdf" onchange="handleFile(this.files[0])">
        </div>

        <img id="image-preview" class="preview-box" alt="Pratonton Dokumen">
        <canvas id="pdf-canvas" style="display:none;"></canvas>
        <div id="status" class="status-msg"></div>
    </div>

    <!-- SEKSYEN BORANG HASIL EKSSTRAK -->
    <div class="card">
        <h3>📝 Data Aset Invois</h3>
        <form id="asset-form" onsubmit="saveData(event)">
            <div class="form-group">
                <label>NAMA ASET / DESKRIPSI</label>
                <input type="text" id="asset-name" required>
            </div>
            <div class="form-group">
                <label>PEMBEKAL / VENDOR</label>
                <input type="text" id="supplier-name" required>
            </div>
            <div class="form-group">
                <label>NO. INVOIS</label>
                <input type="text" id="invoice-no" required>
            </div>
            <div class="form-group">
                <label>TARIKH BELIAN</label>
                <input type="date" id="purchase-date">
            </div>
            <div class="form-group">
                <label>HARGA SEUNIT (RM)</label>
                <input type="number" step="0.01" id="unit-price">
            </div>
            <button type="submit" class="btn-submit">💾 Simpan Aset</button>
        </form>
    </div>
</div>

<script>
    if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function showStatus(text, type) {
        const el = document.getElementById('status');
        el.className = `status-msg ${type}`;
        el.innerText = text;
        el.style.display = 'block';
    }

    // FUNGSI MEMBACA FAIL
    async function handleFile(file) {
        if (!file) return;

        showStatus('⌛ Membaca fail dokumen...', 'info');
        const imgPreview = document.getElementById('image-preview');

        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                imgPreview.src = e.target.result;
                imgPreview.style.display = 'block';
                runOCR(e.target.result);
            };
            reader.readAsDataURL(file);
        } else if (file.type === 'application/pdf') {
            try {
                const buffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
                const page = await pdf.getPage(1);
                
                const canvas = document.getElementById('pdf-canvas');
                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                const imgData = canvas.toDataURL('image/jpeg');
                
                imgPreview.src = imgData;
                imgPreview.style.display = 'block';
                runOCR(imgData);
            } catch (err) {
                showStatus('⚠️ PDF dimasukkan tetapi gagal diproses oleh enjin PDF.', 'error');
            }
        } else {
            showStatus('⚠️ Format tidak disokong. Sila muat naik JPG, PNG atau PDF.', 'error');
        }
    }

    // FUNGSI OCR
    async function runOCR(imageSource) {
        showStatus('🔍 Enjin OCR sedang mengekstrak teks...', 'info');
        try {
            const worker = await Tesseract.createWorker('eng');
            const res = await worker.recognize(imageSource);
            await worker.terminate();

            parseTextToForm(res.data.text);
            showStatus('✅ Dokumen berjaya dimuat naik & diimbas!', 'success');
        } catch (err) {
            console.error(err);
            showStatus('ℹ️ Fail berjaya dimuat naik. Sila lengkapkan borang secara manual (Akses OCR disekat rangkaian/localhost).', 'info');
        }
    }

    function parseTextToForm(text) {
        const lines = text.split('\n').filter(l => l.trim().length > 0);
        if (lines.length > 0) document.getElementById('supplier-name').value = lines[0].trim();

        const inv = text.match(/(?:INV|INVOICE|NO|BIL)\s*[\:\.#]?\s*([A-Z0-9\-\/]{3,20})/i);
        if (inv) document.getElementById('invoice-no').value = inv[1];

        const price = text.match(/(?:RM|\$)?\s*(\d+\.\d{2})/i);
        if (price) document.getElementById('unit-price').value = price[1];
    }

    function saveData(e) {
        e.preventDefault();
        alert('Data berjaya disimpan!');
    }
</script>

</body>
</html>

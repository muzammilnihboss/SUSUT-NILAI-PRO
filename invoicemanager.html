<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai.My - Invoice Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-[#f8fafc]">

    <header class="bg-slate-900 text-slate-100 p-4 sticky top-0 z-30 border-b border-slate-800 flex items-center justify-between">
        <a href="dashboard.html" class="flex items-center space-x-3 text-white font-extrabold">
            <div class="bg-emerald-500 p-2 rounded-xl"><i class="fa-solid fa-vault"></i></div>
            <span>Susut<span class="text-emerald-500">Nilai.My</span></span>
        </a>
        <nav class="hidden md:flex space-x-2 text-xs font-semibold">
            <a href="dashboard.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Dashboard</a>
            <a href="servicereport.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Service Report</a>
            <a href="invoicemanager.html" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg">Invoice Manager</a>
            <a href="registernew.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Register New</a>
            <a href="assetregister.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Asset Register</a>
            <a href="depreciationschedule.html" class="px-3 py-1.5 text-slate-400 hover:text-white">Depreciation Schedule</a>
        </nav>
    </header>

    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/60 shadow-lg space-y-6">
            <div class="flex items-center space-x-3.5 border-b border-slate-100 pb-4">
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-2xl"><i class="fa-solid fa-camera text-xl"></i></div>
                <div>
                    <h2 class="text-lg font-extrabold text-slate-900">AI Invoice & Receipt Manager</h2>
                    <p class="text-xs text-slate-400">Upload purchase receipts or take a photo to automatically parse metadata.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 space-y-5">
                    <div class="border-2 border-dashed border-slate-200 bg-slate-50/50 hover:bg-white rounded-3xl p-8 text-center cursor-pointer relative" onclick="document.getElementById('scan-file-input').click()">
                        <input type="file" id="scan-file-input" accept="image/*" class="hidden" onchange="handleImageSelection(event)">
                        <div id="scan-placeholder" class="py-12 space-y-4">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-emerald-500"></i>
                            <div>
                                <p class="text-xs font-bold text-slate-800">Click to Upload Document File</p>
                                <p class="text-[10px] text-slate-400 mt-1">PNG, JPG or PDF up to 5MB</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-7 bg-slate-50 border border-slate-200 p-6 rounded-3xl space-y-4">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">AI Core Extraction</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">Asset Description</label>
                            <input type="text" id="scan-res-name" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">Category</label>
                            <select id="scan-res-category" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
                                <option value="Office Equipment">Office Equipment</option>
                                <option value="Computer & Hardware">Computer & Hardware</option>
                                <option value="Furniture & Fittings">Furniture & Fittings</option>
                                <option value="Motor Vehicle">Motor Vehicle</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">Supplier Name</label>
                            <input type="text" id="scan-res-pembekal" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">Invoice Number</label>
                            <input type="text" id="scan-res-invois" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
                        </div>
                    </div>
                    <button onclick="saveScannedAsset()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs hover:bg-emerald-500 transition">Save to Ledger</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function handleImageSelection(e) {
            if(e.target.files && e.target.files[0]) {
                alert("Fail berjaya dimuat naik. Memproses fail...");
            }
        }
        function saveScannedAsset() {
            alert("Aset berjaya disimpan ke lejer!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Register - Susut Nilai Pro</title>
  
  <!-- html2pdf.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .back-btn {
      text-decoration: none;
      color: #64748b;
      font-weight: 600;
      font-size: 14px;
    }

    .back-btn:hover { color: #0f172a; }

    .action-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-primary { background-color: #2563eb; color: #fff; }
    .btn-primary:hover { background-color: #1d4ed8; }

    .btn-secondary { background-color: #059669; color: #fff; }
    .btn-secondary:hover { background-color: #047857; }

    .btn-dark { background-color: #334155; color: #fff; }
    .btn-dark:hover { background-color: #1e293b; }

    .register-paper {
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .doc-header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 15px;
    }

    .doc-header h2 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .category-block { margin-bottom: 35px; }

    .category-title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      background-color: #f1f5f9;
      padding: 8px 14px;
      border-left: 4px solid #2563eb;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .table-responsive { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    th, td {
      border: 1px solid #cbd5e1;
      padding: 8px 10px;
      vertical-align: middle;
    }

    th {
      background-color: #f8fafc;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      font-size: 11px;
      white-space: nowrap;
    }

    tr:nth-child(even) { background-color: #fafafa; }

    .text-center { text-align: center; }
    .text-right { text-align: right; }

    .edit-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #64748b;
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #334155;
    }

    /* Modal Edit Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #0f172a;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group-modal {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    .form-group-modal label {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #475569;
    }

    .form-group-modal input, .form-group-modal select {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    @media print {
      body { background: white; padding: 0; }
      .top-nav, .action-col, .edit-btn, .delete-btn { display: none !important; }
      .register-paper { border: none; box-shadow: none; padding: 0; }
      th, td { border: 1px solid #000 !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
      <div class="action-toolbar">
        <a href="registernew.html" class="btn btn-secondary">+ Register New Asset</a>
        <button onclick="printRegister()" class="btn btn-dark">🖨️ Print Register</button>
        <button onclick="exportToPDF()" class="btn btn-primary">📄 Export to PDF</button>
        <a href="index.html" class="back-btn" style="margin-left: 10px;">Log Out</a>
      </div>
    </div>

    <div class="register-paper" id="pdfContent">
      <div class="doc-header">
        <h2>Property, Plant and Equipment Register</h2>
      </div>

      <div id="registerTablesContainer"></div>
    </div>
  </div>

  <!-- Modal Edit Asset -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">Edit Recorded Asset Details</div>
      <form id="editForm" onsubmit="saveAssetEdit(event)">
        <input type="hidden" id="editAssetId">
        
        <div class="form-grid-2">
          <div class="form-group-modal" style="grid-column: span 2;">
            <label>Asset Description / Item</label>
            <input type="text" id="editItem" required>
          </div>
          <div class="form-group-modal">
            <label>Asset Category</label>
            <select id="editCategory">
              <option value="Office Equipment">Office Equipment</option>
              <option value="Computer & Hardware">Computer & Hardware</option>
              <option value="Furniture & Fittings">Furniture & Fittings</option>
              <option value="Motor Vehicle">Motor Vehicle</option>
              <option value="Electrical Installation">Electrical Installation</option>
              <option value="System & Development">System & Development</option>
              <option value="Renovation">Renovation</option>
              <option value="Shop Lot">Shop Lot</option>
              <option value="Other Asset">Other Asset</option>
            </select>
          </div>
          <div class="form-group-modal">
            <label>Ref / Invoice No.</label>
            <input type="text" id="editRefNo" required>
          </div>
          <div class="form-group-modal">
            <label>Model</label>
            <input type="text" id="editModel">
          </div>
          <div class="form-group-modal">
            <label>Purchase Date</label>
            <input type="date" id="editPurchaseDate" required>
          </div>
          <div class="form-group-modal">
            <label>Disposal Date</label>
            <input type="date" id="editDisposalDate">
          </div>
          <div class="form-group-modal">
            <label>Lifespan (Years)</label>
            <input type="number" id="editLifespan" required>
          </div>
          <div class="form-group-modal">
            <label>Unit</label>
            <input type="number" id="editUnit" min="1" required oninput="updateEditTotal()">
          </div>
          <div class="form-group-modal">
            <label>Unit Price (RM)</label>
            <input type="number" id="editUnitPrice" step="0.01" required oninput="updateEditTotal()">
          </div>
          <div class="form-group-modal">
            <label>Total (RM)</label>
            <input type="number" id="editTotal" step="0.01" readonly style="background-color: #f1f5f9;">
          </div>
          <div class="form-group-modal">
            <label>Location / Dept</label>
            <input type="text" id="editLocation" required>
          </div>
          <div class="form-group-modal">
            <label>Updated By</label>
            <input type="text" id="editUpdatedBy" required>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-dark" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-secondary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Membaca data daripada simpanan pelayar (TIADA DEMO DATA)
    function getAssets() {
      return JSON.parse(localStorage.getItem('susut_nilai_assets')) || [];
    }

    function renderAssets() {
      const assets = getAssets();
      const container = document.getElementById('registerTablesContainer');
      container.innerHTML = '';

      if (assets.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No Registered Assets Found</h3>
            <p>You haven't registered any business assets yet.</p>
            <br>
            <a href="registernew.html" class="btn btn-secondary">+ Register Your First Asset</a>
          </div>
        `;
        return;
      }

      const categories = [...new Set(assets.map(a => a.category))];

      categories.forEach(cat => {
        const catAssets = assets.filter(a => a.category === cat);
        
        let tableHTML = `
          <div class="category-block">
            <div class="category-title">Asset Type : ${cat}</div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th class="text-center">No.</th>
                    <th>Purchase Date</th>
                    <th>Disposal Date</th>
                    <th>Item Description</th>
                    <th>Ref. No</th>
                    <th>Model</th>
                    <th class="text-center">Lifespan (Yrs)</th>
                    <th class="text-center">Unit</th>
                    <th class="text-right">Unit Price (RM)</th>
                    <th class="text-right">Total (RM)</th>
                    <th>Location</th>
                    <th>Last Updated</th>
                    <th>Updated By</th>
                    <th class="action-col text-center">Action</th>
                  </tr>
                </thead>
                <tbody>
        `;

        catAssets.forEach((item, index) => {
          tableHTML += `
            <tr>
              <td class="text-center">${index + 1}</td>
              <td>${item.purchaseDate}</td>
              <td>${item.disposalDate || '-'}</td>
              <td><strong>${item.item}</strong></td>
              <td>${item.refNo}</td>
              <td>${item.model || '-'}</td>
              <td class="text-center">${item.lifespan}</td>
              <td class="text-center">${item.unit}</td>
              <td class="text-right">${parseFloat(item.unitPrice).toFixed(2)}</td>
              <td class="text-right">${parseFloat(item.total).toFixed(2)}</td>
              <td>${item.location}</td>
              <td>${item.updatedDate}</td>
              <td>${item.updatedBy}</td>
              <td class="action-col text-center">
                <button class="edit-btn" onclick="openEditModal('${item.id}')">Edit</button>
                <button class="delete-btn" onclick="deleteAsset('${item.id}')">Delete</button>
              </td>
            </tr>
          `;
        });

        tableHTML += `
                </tbody>
              </table>
            </div>
          </div>
        `;

        container.innerHTML += tableHTML;
      });
    }

    function openEditModal(id) {
      const assets = getAssets();
      const asset = assets.find(a => a.id === id);
      if (!asset) return;

      document.getElementById('editAssetId').value = asset.id;
      document.getElementById('editItem').value = asset.item;
      document.getElementById('editCategory').value = asset.category;
      document.getElementById('editRefNo').value = asset.refNo;
      document.getElementById('editModel').value = asset.model || '';
      document.getElementById('editPurchaseDate').value = asset.purchaseDate;
      document.getElementById('editDisposalDate').value = asset.disposalDate === '-' ? '' : asset.disposalDate;
      document.getElementById('editLifespan').value = asset.lifespan;
      document.getElementById('editUnit').value = asset.unit;
      document.getElementById('editUnitPrice').value = asset.unitPrice;
      document.getElementById('editTotal').value = parseFloat(asset.total).toFixed(2);
      document.getElementById('editLocation').value = asset.location;
      document.getElementById('editUpdatedBy').value = asset.updatedBy || 'Admin';

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function updateEditTotal() {
      const u = parseFloat(document.getElementById('editUnit').value) || 0;
      const p = parseFloat(document.getElementById('editUnitPrice').value) || 0;
      document.getElementById('editTotal').value = (u * p).toFixed(2);
    }

    function saveAssetEdit(e) {
      e.preventDefault();
      const id = document.getElementById('editAssetId').value;
      let assets = getAssets();

      const index = assets.findIndex(a => a.id === id);
      if (index !== -1) {
        assets[index] = {
          ...assets[index],
          item: document.getElementById('editItem').value,
          category: document.getElementById('editCategory').value,
          refNo: document.getElementById('editRefNo').value,
          model: document.getElementById('editModel').value,
          purchaseDate: document.getElementById('editPurchaseDate').value,
          disposalDate: document.getElementById('editDisposalDate').value || '-',
          lifespan: document.getElementById('editLifespan').value,
          unit: parseInt(document.getElementById('editUnit').value),
          unitPrice: parseFloat(document.getElementById('editUnitPrice').value),
          total: parseFloat(document.getElementById('editTotal').value),
          location: document.getElementById('editLocation').value,
          updatedDate: new Date().toISOString().split('T')[0],
          updatedBy: document.getElementById('editUpdatedBy').value
        };

        localStorage.setItem('susut_nilai_assets', JSON.stringify(assets));
        renderAssets();
        closeEditModal();
        alert('Asset updated successfully!');
      }
    }

    function deleteAsset(id) {
      if (confirm('Are you sure you want to delete this asset record?')) {
        let assets = getAssets();
        assets = assets.filter(a => a.id !== id);
        localStorage.setItem('susut_nilai_assets', JSON.stringify(assets));
        renderAssets();
      }
    }

    function printRegister() {
      window.print();
    }

    function exportToPDF() {
      const element = document.getElementById('pdfContent');
      const opt = {
        margin:       0.3,
        filename:     'Property_Plant_Equipment_Register.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
      };

      html2pdf().set(opt).from(element).save();
    }

    renderAssets();
  </script>
</body>
</html>

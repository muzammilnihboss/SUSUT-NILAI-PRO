<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SusutNilai.My - Register New Asset</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-[#0b1329] text-white px-6 py-3 flex items-center justify-between border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-[#00b074] rounded-xl flex items-center justify-center font-bold text-white shadow-md">📷</div>
      <div>
        <h1 class="font-black text-sm tracking-tight">Susut<span class="text-[#00b074]">Nilai.My</span></h1>
        <p class="text-[8px] font-extrabold text-slate-400 uppercase tracking-widest">SMART SMB ASSET HUB</p>
      </div>
    </div>
    <div class="bg-[#020617] p-1 rounded-2xl flex items-center gap-1 border border-slate-800/80">
      <a href="dashboard.html" class="px-3 py-1.5 text-slate-300 hover:text-white text-xs font-semibold rounded-xl">Dashboard</a>
      <a href="service-report.html" class="px-3 py-1.5 text-slate-300 hover:text-white text-xs font-semibold rounded-xl">Service Report</a>
      <a href="#" class="px-3 py-1.5 text-slate-300 hover:text-white text-xs font-semibold rounded-xl">Invoice Manager</a>
      <a href="register-asset.html" class="px-3.5 py-1.5 bg-[#00b074] text-white text-xs font-bold rounded-xl">Register New</a>
      <a href="asset-register.html" class="px-3 py-1.5 text-slate-300 hover:text-white text-xs font-semibold rounded-xl">Asset Register</a>
      <a href="depreciation-schedule.html" class="px-3 py-1.5 text-slate-300 hover:text-white text-xs font-semibold rounded-xl">Depreciation Schedule</a>
      <a href="#" class="px-3 py-1.5 text-slate-300 hover:text-white text-xs font-semibold rounded-xl">AI Tax Advisor</a>
    </div>
    <div class="bg-[#1e293b] px-3 py-1.5 rounded-xl border border-slate-700 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
      <span class="text-xs font-bold text-slate-200">mil</span>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6">
    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-bold">📝</div>
        <div>
          <h2 class="text-lg font-black text-slate-900">Manual Asset Registration Protocol</h2>
          <p class="text-xs text-slate-400">Configure parameters accurately to execute general ledger amortization plans.</p>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">ASSET NAME / DESCRIPTION <span class="text-rose-500">*</span></label>
          <input type="text" placeholder="e.g. Ergonomic Office Chair" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-700 focus:bg-white focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">SUPPLIER NAME <span class="text-rose-500">*</span></label>
            <input type="text" placeholder="e.g. Apex Furniture Sdn Bhd" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-700 focus:bg-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">INVOICE NUMBER <span class="text-rose-500">*</span></label>
            <input type="text" placeholder="e.g. INV/2026/0912" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-700 focus:bg-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">ASSET CLASSIFICATION CATEGORY</label>
            <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-semibold text-slate-700 focus:bg-white focus:outline-none focus:border-emerald-500">
              <option>Office Equipment</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">PURCHASE DATE</label>
            <input type="date" value="2026-07-27" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-semibold text-slate-700 focus:bg-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="md:col-span-2">
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">DEPLOYMENT DEPARTMENT <span class="text-rose-500">*</span></label>
            <input type="text" placeholder="e.g. Administrative Office HQ" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-700 focus:bg-white">
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">UNIT</label>
            <input type="number" value="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold text-slate-700">
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">UNIT PRICE</label>
            <input type="text" value="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold text-slate-700">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">ESTIMATED SALVAGE (RM)</label>
            <input type="text" value="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold text-slate-700">
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">ESTIMATED USEFUL LIFE (YRS)</label>
            <input type="number" value="5" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold text-slate-700">
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">AMORTIZATION METHOD</label>
            <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-semibold text-slate-700">
              <option>Straight Line (Equal Amortization)</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai Pro - Service Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-6xl mx-auto p-8 space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">Laporan & Jadual Penyelenggaraan (Service Report)</h1>
            <a href="dashboard.html" class="text-sm font-semibold text-blue-600 hover:underline">← Kembali ke Dashboard</a>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <table class="w-full text-left text-sm border-collapse">
                <thead class="bg-slate-100 text-slate-700 border-b border-slate-200">
                    <tr>
                        <th class="p-4 border-r">ID Aset</th>
                        <th class="p-4 border-r">Nama Aset</th>
                        <th class="p-4 border-r">Tarikh Selenggara Terakhir</th>
                        <th class="p-4 border-r">Selenggara Seterusnya</th>
                        <th class="p-4 border-r">Jenis Servis</th>
                        <th class="p-4">Status Servis</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                    <tr>
                        <td class="p-4 font-mono text-xs">AST-2026-001</td>
                        <td class="p-4 font-semibold">Dell Latitude 5420</td>
                        <td class="p-4">15/01/2026</td>
                        <td class="p-4">15/07/2026</td>
                        <td class="p-4">Pembersihan Internal & OS Update</td>
                        <td class="p-4"><span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold">Perlu Servis</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SusutNilai Pro - Service Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-6xl mx-auto p-8 space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">Laporan Penyelenggaraan Aset</h1>
            <a href="dashboard.html" class="text-sm font-semibold text-blue-600 hover:underline">← Kembali ke Dashboard</a>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <table class="w-full text-left text-sm border-collapse">
                <thead class="bg-slate-100 text-slate-700 border-b">
                    <tr>
                        <th class="p-4 border-r">ID Aset</th>
                        <th class="p-4 border-r">Nama Aset</th>
                        <th class="p-4 border-r">Tarikh Beli</th>
                        <th class="p-4 border-r">Jadual Servis Seterusnya</th>
                        <th class="p-4 border-r">Status Servis</th>
                    </tr>
                </thead>
                <tbody id="serviceBody" class="divide-y divide-slate-200">
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const assets = AppStore.getAssets();
            const tbody = document.getElementById('serviceBody');

            if (assets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-slate-400">Tiada aset untuk dipantau.</td></tr>`;
                return;
            }

            tbody.innerHTML = assets.map(a => {
                const buyDate = new Date(a.tarikhBeli);
                buyDate.setMonth(buyDate.getMonth() + 6);
                const nextService = buyDate.toISOString().split('T')[0];

                return `
                    <tr>
                        <td class="p-4 font-mono text-xs">${a.id}</td>
                        <td class="p-4 font-semibold">${a.perkara}</td>
                        <td class="p-4">${a.tarikhBeli}</td>
                        <td class="p-4 font-mono">${nextService}</td>
                        <td class="p-4"><span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold">Perlu Servis Periodic</span></td>
                    </tr>
                `;
            }).join('');
        });
    </script>
</body>
</html>
